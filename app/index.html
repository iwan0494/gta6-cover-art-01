<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">NC</span>
    <span class="brand-name">Neon Coast</span>
    <span class="brand-sub">Cover Studio &mdash; a Leonida story</span>
  </div>
  <div class="topbar-note">Every photo stays on your machine. No server, no network.</div>
</header>
<main class="workbench">
  <aside id="rail" class="rail" aria-label="Cover controls"></aside>
  <section class="stage-wrap">
    <canvas id="stage" width="1280" height="720" aria-label="Cover preview"></canvas>
    <p class="stage-hint">Click a panel to select it, drag to reframe, scroll to zoom. Export makes all three post sizes at once.</p>
  </section>
</main>
<script src="src/faces.js"></script>
<script src="src/cover.js"></script>
<script src="src/poster.js"></script>
<script src="src/editor.js"></script>
<script src="src/shots.js"></script>
</body>
</html>
