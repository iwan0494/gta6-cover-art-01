<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio — GTA 6 cover art from any photo</title>
<meta name="description" content="Turn any photo into multi-panel GTA 6-style cover art: face-aware crops, chrome 3D title, poster furniture, PNG export in 3 sizes. Works offline.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">NEON COAST</span>
      <span class="brand-sub">Cover Studio — Paid in Sunsets</span>
    </div>
    <div class="top-actions">
      <button id="undoBtn" class="ghost" type="button">↩ Undo</button>
      <button id="redoBtn" class="ghost" type="button">↪ Redo</button>
      <button id="exportBtn" class="primary" type="button">⬇ Ekspor 3 PNG</button>
    </div>
  </header>

  <div class="workbench">
    <aside class="controls">
      <section class="panel">
        <h2>Foto</h2>
        <div id="photoRow" class="thumbs"></div>
        <button id="uploadBtn" class="upload" type="button">+ Upload foto</button>
        <p id="panelInfo" class="info">Panel 1 — Close-up wajah</p>
        <p id="guardNote" class="guard">5 wajah, masing-masing 1x</p>
      </section>

      <section class="panel">
        <h2>Layout</h2>
        <div id="layoutRow" class="chips"></div>
      </section>

      <section class="panel">
        <h2>Grade</h2>
        <div id="gradeRow" class="swatches"></div>
      </section>

      <section class="panel">
        <h2>Judul</h2>
        <label class="field"><span>Judul cover</span>
          <input id="titleInput" type="text" maxlength="18" value="NEON COAST">
        </label>
        <label class="field"><span>Subjudul</span>
          <input id="subInput" type="text" maxlength="40" value="Paid in Sunsets">
        </label>
      </section>
    </aside>

    <main class="stage-wrap">
      <div id="stage" class="stage">
        <canvas id="coverCanvas"></canvas>
        <div id="selection" class="selection" style="display:none"></div>
      </div>
      <p class="hint">Klik panel untuk memilih · seret untuk menggeser crop · scroll untuk zoom · semua foto contoh bebas lisensi (CC0 / picsum) · bekerja offline, tanpa server.</p>
    </main>
  </div>
</div>
<canvas id="shotCanvas" style="display:none"></canvas>
<script type="module" src="src/shots.js"></script>
</body>
</html>
